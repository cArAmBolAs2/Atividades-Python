<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Calculadora Web</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <h1>Calculadora Web</h1>

    <div id="calculator">
        <form method="POST" action="{{ url_for('index') }}">
            <div class="form-grupo">
                <label for="num1">Primeiro número</label>
                <input type="number" id="num1" name="num1" step="any" required
                       value="{{ request.form.get('num1', '') }}">
            </div>

            <div class="form-grupo">
                <label for="operacao">Operação</label>
                {% set op = request.form.get('operacao', '+') %}
                <select id="operacao" name="operacao" required onchange="atualizarFormulario()">
                    <option value="+" {% if op == '+' %}selected{% endif %}>+ Somar</option>
                    <option value="-" {% if op == '-' %}selected{% endif %}>− Subtrair</option>
                    <option value="*" {% if op == '*' %}selected{% endif %}>× Multiplicar</option>
                    <option value="/" {% if op == '/' %}selected{% endif %}>÷ Dividir</option>
                    <option value="**" {% if op == '**' %}selected{% endif %}>^ Potência</option>
                    <option value="sqrt" {% if op == 'sqrt' %}selected{% endif %}>√ Raiz quadrada</option>
                    <option value="log" {% if op == 'log' %}selected{% endif %}>log Logaritmo (Base 10)</option>
                </select>
            </div>

            <div class="form-grupo" id="grupo-num2">
                <label for="num2">Segundo número</label>
                <input type="number" id="num2" name="num2" step="any"
                       value="{{ request.form.get('num2', '') }}">
            </div>

            <button type="submit">Calcular</button>
        </form>

        {% if etapas is not none %}
        <div class="resultado">
            <strong>Resposta do servidor (Python):</strong>
            <div class="etapas">{{ etapas }}</div>
            <div class="valor-final">Resultado: {{ resultados }}</div>
        </div>
        {% endif %}

        <a href="{{ url_for('index') }}" class="btn-limpar">Limpar / nova conta</a>
    </div>

    <script>
        function atualizarFormulario() {
            const operacao = document.getElementById("operacao").value;
            // Oculta num2 se for raiz quadrada ou logaritmo
            const ocultarNum2 = (operacao === "sqrt" || operacao === "log");
            
            const grupo = document.getElementById("grupo-num2");
            const num2 = document.getElementById("num2");
            
            grupo.style.display = ocultarNum2 ? "none" : "block";
            num2.required = !ocultarNum2;
            
            if (ocultarNum2) {
                num2.value = "";
            }
        }
        // Executa ao carregar para manter o estado após o POST
        atualizarFormulario();
    </script>

</body>
</html>
