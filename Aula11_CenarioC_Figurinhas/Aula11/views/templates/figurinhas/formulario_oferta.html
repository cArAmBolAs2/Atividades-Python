{% extends "layout.html" %}
{% block title %}Nova oferta{% endblock %}

{% block content %}
<h1>Nova oferta de troca</h1>

<form method="POST" action="{{ url_for('figurinhas.cadastrar_oferta') }}">
    <div class="form-grupo">
        <label for="colecionador_id">Colecionador</label>
        {# TODO ALUNO resolvido: select dinâmico com loop Jinja2 #}
        <select name="colecionador_id" id="colecionador_id" required>
            <option value="">Quem está oferecendo?</option>
            {% for col in colecionadores %}
            <option value="{{ col.id }}">{{ col.apelido }} ({{ col.cidade }})</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-grupo">
        <label for="figurinha_oferece_id">Figurinha que OFERECE</label>
        <select name="figurinha_oferece_id" id="figurinha_oferece_id" required>
            <option value="">Número / jogador...</option>
            {% for fig in figurinhas %}
            <option value="{{ fig.id }}">#{{ fig.numero }} — {{ fig.nome_jogador }} ({{ fig.time }})</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-grupo">
        <label for="figurinha_deseja_id">Figurinha que DESEJA</label>
        <select name="figurinha_deseja_id" id="figurinha_deseja_id" required>
            <option value="">Número / jogador...</option>
            {% for fig in figurinhas %}
            <option value="{{ fig.id }}">#{{ fig.numero }} — {{ fig.nome_jogador }} ({{ fig.time }})</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-grupo">
        <label for="observacao">Observação</label>
        <input type="text" name="observacao" id="observacao"
               placeholder="Ex.: troco repetida">
    </div>

    <button type="submit" class="btn">Publicar oferta</button>
</form>

<p><a href="{{ url_for('figurinhas.index') }}">← Voltar</a></p>
{% endblock %}
